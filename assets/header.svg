<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFAA"/>
      <stop offset="100%" stop-color="#00CCFF"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glass Effect -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>

  <!-- Animated Ambient Lights -->
  <circle cx="1100" cy="80" r="150" fill="#00FFAA" opacity="0.05">
    <animate attributeName="cx" values="1100;1050;1100" dur="6s" repeatCount="indefinite"/>
  </circle>

  <circle cx="100" cy="240" r="100" fill="#00CCFF" opacity="0.05">
    <animate attributeName="cx" values="100;150;100" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- Glass Card -->
  <rect x="150" y="40" width="900" height="240" rx="20"
    fill="url(#glass)"
    stroke="white"
    stroke-opacity="0.08"/>

  <!-- Name -->
  <text x="600" y="140"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="78"
    font-weight="800"
    fill="url(#accent)"
    text-anchor="middle"
    filter="url(#glow)">
    SHASHANK PANDIT
  </text>

  <!-- Role -->
  <text x="600" y="200"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="22"
    fill="#FFFFFF"
    opacity="0.9"
    text-anchor="middle"
    letter-spacing="5">
    CO-FOUNDER • FULL-STACK ENGINEER • AI ARCHITECT
  </text>

  <!-- Badge -->
  <rect x="500" y="230" width="200" height="36" rx="18"
    stroke="#00FFAA"
    stroke-opacity="0.4"
    fill="#00FFAA"
    fill-opacity="0.08"/>

  <text x="600" y="253"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="14"
    font-weight="600"
    fill="#00FFAA"
    text-anchor="middle">
    BUILDING @ TRUKAPS
  </text>

</svg>
