<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mainBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFAA"/>
      <stop offset="100%" stop-color="#00CCFF"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="20" fill="url(#mainBg)"/>

  <!-- Ambient lights -->
  <circle cx="1100" cy="80" r="150" fill="#00FFAA" opacity="0.05"/>
  <circle cx="100" cy="240" r="100" fill="#00CCFF" opacity="0.05"/>

  <!-- Name -->
  <text x="600" y="140"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="80"
    font-weight="800"
    fill="url(#accentGrad)"
    text-anchor="middle"
    filter="url(#glow)">
    SHASHANK PANDIT
  </text>

  <!-- Role -->
  <text x="600" y="200"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="22"
    fill="#FFFFFF"
    opacity="0.9"
    text-anchor="middle"
    letter-spacing="4">
    CO-FOUNDER • FULL-STACK ENGINEER • AI ARCHITECT
  </text>

  <!-- Badge -->
  <rect x="500" y="230" width="200" height="36" rx="18"
    stroke="#00FFAA" stroke-opacity="0.4"
    fill="#00FFAA" fill-opacity="0.06"/>

  <text x="600" y="253"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="14"
    font-weight="600"
    fill="#00FFAA"
    text-anchor="middle">
    BUILDING @ TRUKAPS
  </text>
</svg>